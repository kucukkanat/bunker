# Fly.io: https://fly.io/docs/reference/configuration/
#
#   fly launch --from https://github.com/kucukkanat/bunker --copy-config
#     (or, in a checkout: fly launch --copy-config)
#   fly logs     # shows the setup URL and code
#
# The volume is created on first deploy from [mounts] (initial_size).
#
# Bunker keeps its data in SQLite on the volume, so run exactly one machine
# (fly scale count 1). FLY_APP_NAME is detected, so the URL is automatic.

app = "bunker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  BUNKER_DATA_DIR = "/data"

[mounts]
  source = "bunker_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
