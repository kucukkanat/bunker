# Bunker for Coolify (https://coolify.io).
#
# In Coolify: + New Resource -> Docker Compose Empty (or "Public Repository"
# with this file's path: /deploy/coolify/docker-compose.yml) -> Deploy.
# Coolify assigns the domain and HTTPS; the setup code is in the logs.
services:
  bunker:
    image: ghcr.io/kucukkanat/bunker:latest
    environment:
      # Coolify generates the public URL and routes it to port 8080.
      - SERVICE_FQDN_BUNKER_8080
      - BUNKER_URL=${SERVICE_FQDN_BUNKER}
      - BUNKER_TRUST_PROXY=true
      # Coolify generates a random value, shown in the resource's Environment tab.
      - BUNKER_SETUP_CODE=${SERVICE_PASSWORD_SETUP}
    volumes:
      - bunker-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/bunker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bunker-data:
