<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign-up sheet</title>
<link rel="stylesheet" href="/_/kit.css">
<style>
/*BK:STYLE*/
.wrap{max-width:860px}
.slot{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border:0}
.slot .time{font-size:.85rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px;max-width:340px}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px;transition:width .3s}
.slot.full .bar i{background:var(--clay)}
.names{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.names span{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;background:var(--card2);border-radius:99px;padding:2px 10px 2px 2px}
.names .avatar{width:22px;height:22px;font-size:.65rem}
.names .me{background:var(--soft);font-weight:600}
.event{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" role="main">
  <div class="hero">
    <div><h1 id="title"></h1><div class="event" id="event"></div></div>
    <div class="pill" id="mycount" hidden></div>
  </div>
  <div class="card"><div id="slots"></div></div>
  <p class="hint" style="margin-top:14px">You can cancel your own sign-up any time. Organisers can export the list from the site’s data page.</p>
</div>
<script>
/*BK:JS*/
// ---- Settings: describe your event and its slots ----
var EVENT = {
  title: 'Volunteer day sign-up',
  when: 'Saturday 14 June',
  where: 'Riverside Park, north gate',
  maxPerPerson: 1 // how many slots one person may take (0 = no limit)
};
var SLOTS = [
  { id: 'setup', label: 'Set-up crew', time: '8:00 – 9:30', capacity: 4 },
  { id: 'cleanup1', label: 'Litter pick: meadow', time: '9:30 – 12:00', capacity: 10 },
  { id: 'cleanup2', label: 'Litter pick: riverbank', time: '9:30 – 12:00', capacity: 8 },
  { id: 'lunch', label: 'Lunch & drinks', time: '12:00 – 13:30', capacity: 3 },
  { id: 'packdown', label: 'Pack-down', time: '13:30 – 15:00', capacity: 5 }
];
// -----------------------------------------------------

var signups = BK.col('signups'), S = [], me = {}, busy = false;
var $ = function (id) { return document.getElementById(id); };
document.title = EVENT.title; $('title').textContent = EVENT.title;
$('event').innerHTML = (EVENT.when ? '<span>📅 ' + BK.esc(EVENT.when) + '</span>' : '') + (EVENT.where ? '<span>📍 ' + BK.esc(EVENT.where) + '</span>' : '');
function isMine(s) { return BK.demo ? s._authorName === 'You' : s._author === me.id; }
function render() {
  var e = BK.esc, mine = S.filter(isMine);
  $('mycount').hidden = !mine.length; $('mycount').textContent = 'You’re signed up for ' + mine.length + ' slot' + (mine.length === 1 ? '' : 's');
  $('slots').innerHTML = SLOTS.map(function (slot) {
    var list = S.filter(function (s) { return s.slot === slot.id; }), n = list.length, full = n >= slot.capacity;
    var mineHere = list.filter(isMine)[0];
    var limit = EVENT.maxPerPerson > 0 && mine.length >= EVENT.maxPerPerson && !mineHere;
    var btn = mineHere ? '<button class="btn" data-cancel="' + e(mineHere._id) + '">Cancel</button>'
      : '<button class="btn primary" data-join="' + e(slot.id) + '"' + (full || limit ? ' disabled' : '') + ' title="' + (full ? 'This slot is full' : limit ? 'You’ve reached the limit' : '') + '">' + (full ? 'Full' : 'Sign up') + '</button>';
    return '<div class="slot' + (full ? ' full' : '') + '"><div><h3>' + e(slot.label) + '</h3><div class="time">' + e(slot.time) + ' · ' + n + ' of ' + slot.capacity + ' taken</div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.min(100, n / slot.capacity * 100) + '%"></i></div></div><div>' + btn + '</div>' +
      (n ? '<div class="names">' + list.map(function (s) { return '<span class="' + (isMine(s) ? 'me' : '') + '"><span class="avatar">' + e(BK.initials(s.name || s._authorName)) + '</span>' + e(s.name || s._authorName) + '</span>'; }).join('') + '</div>' : '') + '</div>';
  }).join('');
}
function load() { return signups.list().then(function (l) { S = l; render(); }).catch(BK.err); }
document.addEventListener('click', function (ev) {
  var j = ev.target.closest('[data-join]'), c = ev.target.closest('[data-cancel]');
  if (busy || (!j && !c)) return;
  busy = true;
  var p = j ? load().then(function () {
      var slot = SLOTS.filter(function (s) { return s.id === j.dataset.join; })[0];
      if (S.filter(function (s) { return s.slot === slot.id; }).length >= slot.capacity) throw new Error('Sorry, that slot just filled up.');
      return signups.add({ slot: slot.id, name: me.name || me.email || 'Someone' }).then(function () { BK.toast('You’re in: ' + slot.label); });
    }) : signups.remove(c.dataset.cancel).then(function () { BK.toast('Cancelled'); });
  p.catch(BK.err).then(function () { busy = false; return load(); });
});
BK.me().then(function (u) { me = u; BK.banner(); load(); });
signups.subscribe(load);
</script>
</body>
</html>
