<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting notes</title>
<link rel="stylesheet" href="/_/kit.css">
<style>
/*BK:STYLE*/
.wrap{max-width:1200px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.mlist button{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;cursor:pointer}
.mlist button:hover{background:var(--card2)}.mlist button[aria-current=true]{background:var(--soft)}
.mlist b{display:block}.mlist small{color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.items li{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.items li input[type=text]{flex:1}
.items li.done span.t{text-decoration:line-through;color:var(--muted)}
.dec{padding:12px 0;border-bottom:1px solid var(--line)}.dec:last-child{border:0}.dec .m{font-size:.85rem;color:var(--muted)}
.saved{font-size:.8rem;color:var(--muted)}
textarea#notes{min-height:220px;font-size:.95rem;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><h1>Meeting notes</h1><p>Notes, decisions and action items in one place, searchable later.</p></div>
    <div class="tabs" role="group" aria-label="View"><button aria-pressed="true" data-v="notes">Meetings</button><button aria-pressed="false" data-v="log">Decision log</button><button aria-pressed="false" data-v="actions">Open actions</button></div>
  </div>
  <div class="layout" id="v-notes">
    <aside class="card">
      <button class="btn primary" id="new" style="width:100%;margin-bottom:10px">+ New meeting</button>
      <input type="search" id="q" placeholder="Search notes…" aria-label="Search meetings" style="margin-bottom:8px">
      <div class="mlist" id="mlist"></div>
    </aside>
    <section class="card" id="editor"><div class="empty">Pick a meeting or start a new one.</div></section>
  </div>
  <section class="card" id="v-log" hidden></section>
  <section class="card" id="v-actions" hidden></section>
</div>
<script>
/*BK:JS*/
var meetings = BK.col('meetings'), M = [], cur = null, me = {}, saveT = null;
var $ = function (id) { return document.getElementById(id); }, e = BK.esc;
function sorted() { return M.slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')) || (b._created || 0) - (a._created || 0); }); }
function renderList() {
  var q = $('q').value.toLowerCase();
  var list = sorted().filter(function (m) { return !q || JSON.stringify([m.title, m.notes, m.attendees, m.decisions, m.actions]).toLowerCase().indexOf(q) >= 0; });
  $('mlist').innerHTML = list.length ? list.map(function (m) { return '<button data-id="' + e(m._id) + '" aria-current="' + (cur && cur._id === m._id) + '"><b>' + e(m.title || 'Untitled') + '</b><small>' + e(m.date || '') + ((m.decisions || []).length ? ' · ' + m.decisions.length + ' decision' + (m.decisions.length === 1 ? '' : 's') : '') + '</small></button>'; }).join('') : '<p class="muted" style="padding:8px">No meetings yet.</p>';
}
function renderEditor() {
  if (!cur) { $('editor').innerHTML = '<div class="empty">Pick a meeting or start a new one.</div>'; return; }
  var m = cur;
  $('editor').innerHTML =
    '<div class="row"><input type="text" id="m-title" aria-label="Meeting title" value="' + e(m.title || '') + '" style="font:600 1.3rem var(--serif);border-color:transparent;padding-left:0;flex:1;min-width:200px"><input type="date" id="m-date" aria-label="Date" value="' + e(m.date || '') + '" style="width:auto"><span class="saved" id="saved"></span></div>' +
    '<div class="field" style="margin-top:8px"><label for="m-att">Attendees</label><input type="text" id="m-att" value="' + e(m.attendees || '') + '" placeholder="Names, comma-separated"></div>' +
    '<div class="field"><label for="notes">Notes</label><textarea id="notes" placeholder="What was discussed…">' + e(m.notes || '') + '</textarea></div>' +
    '<div class="grid g2"><div><h3>Decisions</h3><ul class="items" id="decs" style="padding:0;list-style:none"></ul><form id="add-dec" class="row"><input type="text" placeholder="We decided to…" aria-label="New decision" style="flex:1"><button class="btn small">Add</button></form></div>' +
    '<div><h3>Action items</h3><ul class="items" id="acts" style="padding:0;list-style:none"></ul><form id="add-act" class="row"><input type="text" placeholder="Who does what" aria-label="New action" style="flex:1"><input type="text" placeholder="Owner" aria-label="Owner" style="width:110px"><button class="btn small">Add</button></form></div></div>' +
    '<div class="row" style="margin-top:16px"><button class="btn small" id="ai">✨ Draft summary from notes</button><span class="spacer"></span><button class="btn small danger" id="del">Delete meeting</button></div>';
  items();
  ['m-title', 'm-date', 'm-att', 'notes'].forEach(function (id) { $(id).addEventListener('input', queueSave); });
  $('add-dec').onsubmit = function (ev) { ev.preventDefault(); var i = this.querySelector('input'); if (!i.value.trim()) return; (cur.decisions = cur.decisions || []).push({ text: i.value.trim() }); i.value = ''; items(); save(); };
  $('add-act').onsubmit = function (ev) { ev.preventDefault(); var i = this.querySelectorAll('input'); if (!i[0].value.trim()) return; (cur.actions = cur.actions || []).push({ text: i[0].value.trim(), owner: i[1].value.trim(), done: false }); i[0].value = ''; i[1].value = ''; items(); save(); };
  $('del').onclick = function () { if (!confirm('Delete this meeting and its notes?')) return; meetings.remove(cur._id).then(function () { cur = null; load(); }).catch(BK.err); };
  $('ai').onclick = draft;
}
function items() {
  $('decs').innerHTML = (cur.decisions || []).map(function (d, i) { return '<li><span>✔︎</span><span class="t" style="flex:1">' + e(d.text) + '</span><button class="btn small ghost" data-rm-dec="' + i + '" aria-label="Remove decision">×</button></li>'; }).join('') || '<li class="muted">None yet.</li>';
  $('acts').innerHTML = (cur.actions || []).map(function (a, i) { return '<li class="' + (a.done ? 'done' : '') + '"><input type="checkbox" data-done="' + i + '"' + (a.done ? ' checked' : '') + ' aria-label="Done"><span class="t" style="flex:1">' + e(a.text) + (a.owner ? ' <span class="pill">' + e(a.owner) + '</span>' : '') + '</span><button class="btn small ghost" data-rm-act="' + i + '" aria-label="Remove action">×</button></li>'; }).join('') || '<li class="muted">None yet.</li>';
}
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t.dataset.rmDec != null) { cur.decisions.splice(+t.dataset.rmDec, 1); items(); save(); }
  if (t.dataset.rmAct != null) { cur.actions.splice(+t.dataset.rmAct, 1); items(); save(); }
  if (t.dataset.done != null) { cur.actions[+t.dataset.done].done = t.checked; items(); save(); }
  var b = t.closest('.mlist button'); if (b) { cur = M.filter(function (m) { return m._id === b.dataset.id; })[0]; renderList(); renderEditor(); }
});
function queueSave() { $('saved').textContent = 'Editing…'; clearTimeout(saveT); saveT = setTimeout(save, 700); }
function save() {
  if (!cur) return; clearTimeout(saveT); saveT = null;
  cur.title = $('m-title').value; cur.date = $('m-date').value; cur.attendees = $('m-att').value; cur.notes = $('notes').value;
  var patch = { title: cur.title, date: cur.date, attendees: cur.attendees, notes: cur.notes, decisions: cur.decisions || [], actions: cur.actions || [] };
  meetings.update(cur._id, patch).then(function () { var s = $('saved'); if (s) s.textContent = 'Saved'; renderList(); }).catch(BK.err);
}
function draft() {
  var notes = $('notes').value.trim(); if (!notes) { BK.toast('Write some notes first.'); return; }
  var b = $('ai'); b.disabled = true; b.textContent = 'Thinking…';
  BK.ai([{ role: 'user', content: 'From these meeting notes, list the decisions and the action items (with owner if named). Reply as JSON {"decisions":[string],"actions":[{"text":string,"owner":string}]}.\n\n' + notes.slice(0, 12000) }], { json: true }).then(function (out) {
    if (out == null) { BK.toast('AI isn’t set up on this Bunker. Ask your admin.'); return; }
    var j; try { j = typeof out === 'string' ? JSON.parse(out.replace(/^```(json)?|```$/g, '')) : out; } catch (x) { BK.toast('The AI reply was unclear. Try again.'); return; }
    (j.decisions || []).forEach(function (d) { (cur.decisions = cur.decisions || []).push({ text: String(d) }); });
    (j.actions || []).forEach(function (a) { (cur.actions = cur.actions || []).push({ text: String(a.text || a), owner: String(a.owner || ''), done: false }); });
    items(); save(); BK.toast('Added suggestions. Review and edit them.');
  }).catch(BK.err).then(function () { b.disabled = false; b.textContent = '✨ Draft summary from notes'; });
}
function renderLog() {
  var all = []; sorted().forEach(function (m) { (m.decisions || []).forEach(function (d) { all.push({ d: d, m: m }); }); });
  $('v-log').innerHTML = '<h2>Decision log</h2>' + (all.length ? all.map(function (x) { return '<div class="dec"><div>' + e(x.d.text) + '</div><div class="m">' + e(x.m.date || '') + ' · ' + e(x.m.title || 'Untitled') + '</div></div>'; }).join('') : '<div class="empty">No decisions recorded yet.</div>');
  var open = []; sorted().forEach(function (m) { (m.actions || []).forEach(function (a) { if (!a.done) open.push({ a: a, m: m }); }); });
  $('v-actions').innerHTML = '<h2>Open actions</h2>' + (open.length ? '<table><thead><tr><th>Action</th><th>Owner</th><th>From</th></tr></thead><tbody>' + open.map(function (x) { return '<tr><td>' + e(x.a.text) + '</td><td>' + e(x.a.owner || '—') + '</td><td>' + e(x.m.title || '') + ' <span class="muted">' + e(x.m.date || '') + '</span></td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">All caught up.</div>');
}
document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () {
  document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
  $('v-notes').hidden = b.dataset.v !== 'notes'; $('v-log').hidden = b.dataset.v !== 'log'; $('v-actions').hidden = b.dataset.v !== 'actions'; renderLog(); }; });
$('new').onclick = function () {
  meetings.add({ title: 'New meeting', date: new Date().toISOString().slice(0, 10), attendees: me.name || '', notes: '', decisions: [], actions: [] }).then(function (doc) {
    return load().then(function () { cur = M.filter(function (m) { return doc && m._id === doc._id; })[0] || sorted()[0]; renderList(); renderEditor(); var t = $('m-title'); if (t) { t.focus(); t.select(); } });
  }).catch(BK.err);
};
$('q').oninput = renderList;
function load() { return meetings.list().then(function (l) { M = l; if (cur) { var fresh = M.filter(function (m) { return m._id === cur._id; })[0]; if (!fresh) cur = null; } renderList(); if (!cur) renderEditor(); renderLog(); }).catch(BK.err); }
BK.me().then(function (u) { me = u; BK.banner(); load(); });
meetings.subscribe(function () { if (!saveT) load(); });
</script>
</body>
</html>
