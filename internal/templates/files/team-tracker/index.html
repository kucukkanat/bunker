<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team tracker</title>
<link rel="stylesheet" href="/_/kit.css">
<style>
/*BK:STYLE*/
.wrap{max-width:1280px}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px;transition:background .15s}
.col.over{background:var(--soft);border-color:var(--moss)}
.col header{display:flex;align-items:center;gap:8px}.col header h2{margin:0;font-size:1rem}.col header .n{color:var(--muted);font-size:.85rem}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tcard:active{cursor:grabbing}.tcard.dragging{opacity:.4}
.tcard .t{font-weight:600;margin-bottom:6px;word-break:break-word}
.tcard .m{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.tcard .due.late{color:var(--warn);font-weight:600}
.tcard .mv{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .15s}
.tcard:hover .mv,.tcard:focus-within .mv{opacity:1}
.add{display:flex;gap:6px;align-items:center}.add input{flex:1;min-width:0}.add .btn{flex:none}
.tag{font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--soft)}
.online{display:flex;gap:-6px}.online .avatar{margin-left:-6px;border:2px solid var(--bg)}
</style>
</head>
<body>
<div class="wrap" role="main">
  <div class="hero">
    <div><h1>Team tracker</h1><p>Drag cards between columns. Everyone sees changes live.</p></div>
    <div class="row"><div class="online" id="online" aria-label="People here now"></div><input type="search" id="q" placeholder="Filter cards…" aria-label="Filter cards" style="width:200px"><label class="row" style="margin:0;font-weight:400"><input type="checkbox" id="mine"> Only mine</label></div>
  </div>
  <div class="board" id="board"></div>
</div>
<dialog id="dlg">
  <form method="dialog" id="edit">
    <h2>Edit card</h2>
    <div class="field"><label for="e-title">Title</label><input type="text" id="e-title" required></div>
    <div class="grid g2"><div class="field"><label for="e-owner">Owner</label><input type="text" id="e-owner" placeholder="Name"></div><div class="field"><label for="e-due">Due</label><input type="date" id="e-due"></div></div>
    <div class="field"><label for="e-tag">Label</label><input type="text" id="e-tag" placeholder="e.g. Urgent"></div>
    <div class="field"><label for="e-notes">Notes</label><textarea id="e-notes"></textarea></div>
    <div class="row"><button class="btn danger" value="delete" type="submit">Delete</button><span class="spacer"></span><button class="btn" value="cancel" type="submit">Cancel</button><button class="btn primary" value="save" type="submit">Save</button></div>
  </form>
</dialog>
<script>
/*BK:JS*/
// ---- Settings ----
// Columns, left to right. Rename freely; cards keep their column by name.
var COLUMNS = ['To do', 'In progress', 'Done'];
// Site owners: set the "cards" collection rule to "open" so teammates can
// move each other's cards.
// -------------------

var cards = BK.col('cards'), C = [], me = {}, dragId = null, editing = null;
var room = BK.room('board');
var $ = function (id) { return document.getElementById(id); };
var board = $('board'); board.style.setProperty('--cols', COLUMNS.length);
function today() { return new Date().toISOString().slice(0, 10); }
function render() {
  var q = $('q').value.toLowerCase(), mine = $('mine').checked, e = BK.esc;
  board.innerHTML = '';
  COLUMNS.forEach(function (name, ci) {
    var list = C.filter(function (c) { return (c.col || COLUMNS[0]) === name || (ci === 0 && COLUMNS.indexOf(c.col) < 0); })
      .filter(function (c) { return (!q || (c.title + ' ' + (c.owner || '') + ' ' + (c.tag || '')).toLowerCase().indexOf(q) >= 0) && (!mine || (c.owner || '').toLowerCase() === (me.name || '').toLowerCase() || c._author === me.id); })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    var col = document.createElement('section'); col.className = 'col'; col.dataset.col = name; col.setAttribute('aria-label', name);
    col.innerHTML = '<header><h2>' + e(name) + '</h2><span class="n">' + list.length + '</span></header>';
    list.forEach(function (c) {
      var el = document.createElement('article'); el.className = 'tcard'; el.draggable = true; el.dataset.id = c._id; el.tabIndex = 0;
      var late = c.due && c.due < today() && name !== COLUMNS[COLUMNS.length - 1];
      el.innerHTML = '<div class="t">' + e(c.title) + '</div><div class="m">' + (c.owner ? '<span class="avatar" title="' + e(c.owner) + '">' + e(BK.initials(c.owner)) + '</span>' : '') +
        (c.tag ? '<span class="tag">' + e(c.tag) + '</span>' : '') + (c.due ? '<span class="due' + (late ? ' late' : '') + '">' + (late ? 'Late · ' : 'Due ') + e(c.due) + '</span>' : '') + '</div>' +
        '<div class="mv">' + (ci > 0 ? '<button class="btn small" data-move="-1" aria-label="Move left">←</button>' : '') + (ci < COLUMNS.length - 1 ? '<button class="btn small" data-move="1" aria-label="Move right">→</button>' : '') + '<span class="spacer"></span><button class="btn small ghost" data-edit aria-label="Edit">Edit</button></div>';
      el.addEventListener('dragstart', function (ev) { dragId = c._id; el.classList.add('dragging'); ev.dataTransfer.setData('text/plain', c._id); ev.dataTransfer.effectAllowed = 'move'; });
      el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
      el.addEventListener('dblclick', function () { openEdit(c); });
      el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') openEdit(c); if (ev.key === 'ArrowRight' && ci < COLUMNS.length - 1) move(c, COLUMNS[ci + 1]); if (ev.key === 'ArrowLeft' && ci > 0) move(c, COLUMNS[ci - 1]); });
      el.querySelectorAll('[data-move]').forEach(function (b) { b.onclick = function () { move(c, COLUMNS[ci + Number(b.dataset.move)]); }; });
      el.querySelector('[data-edit]').onclick = function () { openEdit(c); };
      col.appendChild(el);
    });
    var add = document.createElement('form'); add.className = 'add';
    add.innerHTML = '<input type="text" placeholder="Add a card…" aria-label="New card in ' + e(name) + '" maxlength="200"><button class="btn small" type="submit">Add</button>';
    add.onsubmit = function (ev) { ev.preventDefault(); var t = add.querySelector('input').value.trim(); if (!t) return;
      cards.add({ title: t, col: name, owner: me.name || '', order: Date.now() }).then(function () { changed(); }).catch(BK.err); };
    col.appendChild(add);
    col.addEventListener('dragover', function (ev) { ev.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', function () { col.classList.remove('over'); });
    col.addEventListener('drop', function (ev) {
      ev.preventDefault(); col.classList.remove('over');
      var c = C.filter(function (x) { return x._id === (dragId || ev.dataTransfer.getData('text/plain')); })[0];
      if (c && c.col !== name) move(c, name);
    });
    board.appendChild(col);
  });
}
function move(c, to) {
  c.col = to; c.order = Date.now(); render();
  cards.update(c._id, { col: to, order: c.order }).then(changed).catch(function (e) { BK.err(e); load(); });
}
function openEdit(c) {
  editing = c; $('e-title').value = c.title || ''; $('e-owner').value = c.owner || ''; $('e-due').value = c.due || ''; $('e-tag').value = c.tag || ''; $('e-notes').value = c.notes || '';
  $('dlg').showModal();
}
$('dlg').addEventListener('close', function () {
  var v = $('dlg').returnValue, c = editing; editing = null; if (!c) return;
  if (v === 'save') cards.update(c._id, { title: $('e-title').value.trim() || c.title, owner: $('e-owner').value.trim(), due: $('e-due').value, tag: $('e-tag').value.trim(), notes: $('e-notes').value }).then(changed).catch(BK.err);
  if (v === 'delete' && confirm('Delete this card?')) cards.remove(c._id).then(changed).catch(BK.err);
});
function changed() { load(); room.send({ type: 'changed' }); }
function load() { return cards.list().then(function (l) { C = l; render(); }).catch(BK.err); }
function showOnline(list) {
  var el = $('online'); el.innerHTML = '';
  (list || []).slice(0, 6).forEach(function (p) { var n = (p.state && p.state.name) || p.name || p.userName || '?'; var a = document.createElement('span'); a.className = 'avatar'; a.title = n; a.textContent = BK.initials(n); el.appendChild(a); });
}
$('q').oninput = render; $('mine').onchange = render;
BK.me().then(function (u) {
  me = u; BK.banner(); load();
  try { Promise.resolve(room.presence({ name: u.name })).then(function (l) { if (Array.isArray(l)) showOnline(l); }); } catch (e) {}
});
cards.subscribe(load);
if (room.onPresence) room.onPresence(showOnline);
</script>
</body>
</html>
