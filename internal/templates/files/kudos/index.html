<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kudos wall</title>
<link rel="stylesheet" href="/_/kit.css">
<style>
/*BK:STYLE*/
.wrap{max-width:1180px}
.top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:22px;align-items:start}
.compose h2{margin-bottom:10px}
.values{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0 0 14px}
.values legend{font-weight:500;font-size:.9rem;margin-bottom:6px;padding:0}
.values label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:500;font-size:.88rem;cursor:pointer;background:var(--card)}
.values label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.values label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.values input{position:absolute;opacity:0;width:1px;height:1px}
.board h2{margin-bottom:8px}
.lead{list-style:none;margin:0;padding:0}.lead li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.lead li:last-child{border:0}
.lead .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.wall{columns:3 280px;column-gap:14px}
.kudo{break-inside:avoid;margin:0 0 14px;padding:0;overflow:hidden;display:block}
.kudo .band{height:6px;background:var(--c,var(--moss))}
.kudo .in{padding:14px 16px 12px}
.kudo .to{font:600 1.2rem/1.2 var(--serif);margin:2px 0 6px;word-break:break-word}
.kudo .val{font-size:.78rem;font-weight:600;color:var(--muted)}
.kudo .msg{margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.kudo .by{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.kudo .by .avatar{width:24px;height:24px;font-size:.62rem}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reacts button{min-height:32px;padding:2px 10px;border-radius:99px;background:var(--card2);border:1px solid transparent;color:var(--text);font-weight:600;font-size:.85rem}
.reacts button:hover{background:var(--soft);color:var(--text);border-color:var(--line)}
.reacts button[aria-pressed=true]{background:var(--soft);border-color:var(--moss)}
.reacts .c{font-variant-numeric:tabular-nums;min-width:.6em}
.kudo.new{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.96);opacity:.2}to{transform:none;opacity:1}}
@media(max-width:820px){.top{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" role="main">
  <div class="hero">
    <div><h1>Kudos wall</h1><p>Say thanks out loud. Big wins, small kindnesses, everything in between.</p></div>
  </div>
  <div class="top">
    <form class="card compose" id="f">
      <h2>Give kudos</h2>
      <div class="field"><label for="to">To</label><input type="text" id="to" required maxlength="80" list="people" placeholder="Who are you thanking?" autocomplete="off"><datalist id="people"></datalist></div>
      <fieldset class="values" id="values"><legend>For</legend></fieldset>
      <div class="field"><label for="msg">Message</label><textarea id="msg" required maxlength="600" placeholder="What did they do, and why did it matter?" style="min-height:80px"></textarea></div>
      <div class="row"><span class="hint" id="count" aria-live="polite"></span><span class="spacer"></span><button class="btn primary" type="submit">Post kudos</button></div>
    </form>
    <section class="card board" aria-labelledby="lead-h"><h2 id="lead-h">Most thanked this month</h2><ol class="lead" id="lead"></ol></section>
  </div>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Show" id="seg"><button aria-pressed="true" data-f="all">Everyone</button><button aria-pressed="false" data-f="me">For me</button><button aria-pressed="false" data-f="mine">From me</button></div>
    <label class="sr" for="vf">Value</label><select id="vf"></select>
    <label class="sr" for="q">Search kudos</label><input type="search" id="q" placeholder="Search names or words…">
  </div>
  <div id="wall" aria-live="polite"><div class="empty" aria-busy="true">Loading kudos…</div></div>
</div>
<script>
/*BK:JS*/
// ---- Settings ----
var VALUES = [
  { name: 'Team player', icon: '🤝', color: '#4F7A63' },
  { name: 'Above and beyond', icon: '🚀', color: '#C2683F' },
  { name: 'Customer hero', icon: '💛', color: '#C9A227' },
  { name: 'Brilliant idea', icon: '💡', color: '#3E6E8E' },
  { name: 'Kindness', icon: '🌱', color: '#7A5C99' }
];
var REACTIONS = ['👏', '❤️', '🎉', '😂'];
// Data rules (set by the template): "kudos" and "reactions" use the default
// rule: everyone sees everything, people change only what they posted.
// -------------------

var kudos = BK.col('kudos'), reactions = BK.col('reactions');
var K = [], R = [], me = {}, filter = 'all', seen = null;
var $ = function (id) { return document.getElementById(id); }, e = BK.esc;
function valueOf(n) { return VALUES.filter(function (v) { return v.name === n; })[0] || VALUES[0]; }
function low(s) { return String(s || '').trim().toLowerCase(); }
function ago(t) { var s = (Date.now() - BK.ms(t)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago'; return new Date(BK.ms(t)).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

function render() {
  var q = low($('q').value), vf = $('vf').value;
  // Leaderboard: this calendar month.
  var start = new Date(); start.setDate(1); start.setHours(0, 0, 0, 0);
  var tally = {}; K.forEach(function (k) { if (BK.ms(k._created) >= start.getTime()) { var n = String(k.to).trim(); tally[low(n)] = tally[low(n)] || { n: n, c: 0 }; tally[low(n)].c++; } });
  var top = Object.keys(tally).map(function (k) { return tally[k]; }).sort(function (a, b) { return b.c - a.c || a.n.localeCompare(b.n); }).slice(0, 5);
  $('lead').innerHTML = top.length ? top.map(function (t) { return '<li><span class="avatar" aria-hidden="true">' + e(BK.initials(t.n)) + '</span><span>' + e(t.n) + '</span><span class="n">' + t.c + '</span></li>'; }).join('')
    : '<li class="muted">No kudos this month yet. Be the first!</li>';
  var names = {}; K.forEach(function (k) { names[String(k.to).trim()] = 1; if (k._authorName) names[k._authorName] = 1; });
  $('people').innerHTML = Object.keys(names).sort().map(function (n) { return '<option value="' + e(n) + '">'; }).join('');
  var list = K.filter(function (k) {
    if (filter === 'me' && low(k.to) !== low(me.name) && low(k.to) !== low(String(me.name || '').split(' ')[0])) return false;
    if (filter === 'mine' && k._author !== me.id) return false;
    if (vf && k.value !== vf) return false;
    return !q || low([k.to, k.message, k._authorName, k.value].join(' ')).indexOf(q) >= 0;
  }).sort(function (a, b) { return BK.ms(b._created) - BK.ms(a._created); });
  var box = $('wall');
  if (!K.length) { box.innerHTML = '<div class="empty"><span class="ico" aria-hidden="true">🙌</span><b>The wall is empty</b>Who helped you this week? Thank them above. It takes 20 seconds and makes their day.</div>'; return; }
  if (!list.length) { box.innerHTML = '<div class="empty"><b>' + (filter === 'me' ? 'No kudos for you yet' : 'Nothing matches') + '</b>' + (filter === 'me' ? 'They’ll show up here. Meanwhile, why not thank someone?' : 'Try another filter.') + '</div>'; return; }
  box.innerHTML = '<div class="wall">' + list.map(function (k) {
    var v = valueOf(k.value), mine = k._author === me.id, fresh = seen && !seen[k._id];
    var rs = R.filter(function (r) { return r.kudo === k._id; });
    return '<article class="card kudo' + (fresh ? ' new' : '') + '" style="--c:' + v.color + '" aria-label="Kudos for ' + e(k.to) + '"><div class="band"></div><div class="in">' +
      '<div class="val">' + v.icon + ' ' + e(v.name) + '</div><div class="to">' + e(k.to) + '</div><p class="msg">' + e(k.message) + '</p>' +
      '<div class="by"><span class="avatar" aria-hidden="true">' + e(BK.initials(k._authorName)) + '</span><span>from ' + (mine ? 'you' : e(k._authorName || 'someone')) + ' · ' + e(ago(k._created)) + '</span>' +
      (mine ? '<span class="spacer"></span><button class="btn small ghost" data-del="' + e(k._id) + '" aria-label="Delete your kudos for ' + e(k.to) + '">Delete</button>' : '') + '</div>' +
      '<div class="reacts">' + REACTIONS.map(function (em) {
        var these = rs.filter(function (r) { return r.emoji === em; }), on = these.some(function (r) { return r._author === me.id; });
        var who = these.map(function (r) { return r._author === me.id ? 'you' : r._authorName; }).join(', ');
        return '<button type="button" data-k="' + e(k._id) + '" data-e="' + em + '" aria-pressed="' + on + '" aria-label="' + em + ' ' + these.length + (who ? ', from ' + e(who) : '') + '" title="' + e(who) + '">' + em + ' <span class="c">' + (these.length || '') + '</span></button>';
      }).join('') + '</div></div></article>';
  }).join('') + '</div>';
  seen = {}; K.forEach(function (k) { seen[k._id] = 1; });
}

$('wall').addEventListener('click', function (ev) {
  var d = ev.target.closest('[data-del]');
  if (d) { if (confirm('Delete these kudos?')) kudos.remove(d.dataset.del).then(load).catch(BK.err); return; }
  var b = ev.target.closest('[data-e]'); if (!b) return;
  var mineR = R.filter(function (r) { return r.kudo === b.dataset.k && r.emoji === b.dataset.e && r._author === me.id; })[0];
  b.disabled = true;
  (mineR ? reactions.remove(mineR._id) : reactions.add({ kudo: b.dataset.k, emoji: b.dataset.e })).then(load).catch(BK.err);
});
$('values').innerHTML = '<legend>For</legend>' + VALUES.map(function (v, i) { return '<label><input type="radio" name="value" value="' + e(v.name) + '"' + (i === 0 ? ' checked' : '') + '><span aria-hidden="true">' + v.icon + '</span>' + e(v.name) + '</label>'; }).join('');
$('vf').innerHTML = '<option value="">All values</option>' + VALUES.map(function (v) { return '<option value="' + e(v.name) + '">' + v.icon + ' ' + e(v.name) + '</option>'; }).join('');
$('msg').oninput = function () { var n = $('msg').value.length; $('count').textContent = n > 500 ? (600 - n) + ' characters left' : ''; };
$('f').onsubmit = function (ev) {
  ev.preventDefault();
  var to = $('to').value.trim(), msg = $('msg').value.trim();
  if (!to || !msg) return;
  if (low(to) === low(me.name)) { BK.toast('Kudos are for other people. 😊'); return $('to').focus(); }
  // Clear the form straight away; put the text back if saving fails.
  $('to').value = ''; $('msg').value = ''; $('count').textContent = '';
  kudos.add({ to: to, value: ($('values').querySelector('input:checked') || {}).value || VALUES[0].name, message: msg })
    .then(function () { BK.toast('Kudos posted. Nice one!'); return load(); })
    .catch(function (err) { if (!$('to').value && !$('msg').value) { $('to').value = to; $('msg').value = msg; } BK.err(err); });
};
$('seg').onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; filter = b.dataset.f; $('seg').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); render(); };
$('q').oninput = render; $('vf').onchange = render;

var timer; function reload() { clearTimeout(timer); timer = setTimeout(load, 120); }
function load() { return Promise.all([kudos.all(), reactions.all()]).then(function (r) { K = r[0]; R = r[1]; render(); }).catch(BK.err); }
BK.me().then(function (u) { me = u; BK.banner(); load(); });
kudos.subscribe(reload); reactions.subscribe(reload);
setInterval(render, 60000);
</script>
</body>
</html>
